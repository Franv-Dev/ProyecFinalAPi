<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Search</title>

    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="pb-5">

    <header class="container text-center my-4">
        <div class="mb-3">
            <img src="https://archives.bulbagarden.net/media/upload/4/4b/Pok%C3%A9dex_logo.png" 
                 alt="Pokédex Logo" 
                 class="img-fluid" 
                 style="max-width: 280px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));">
        </div>
        
        <h1 class="h4 text-white mb-4 fw-bold">Pokémon Search</h1>

        <form id="searchForm" class="row justify-content-center g-2 max-width-search">
            <div class="col-12 col-md-7">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control form-control-lg shadow-sm" placeholder="Buscar por nombre o ID...">
                    <button class="btn btn-dark btn-lg px-4 fw-bold" type="submit">Buscar</button>
                </div>
            </div>
            
            <div class="col-6 col-md-3">
                <select name="page" id="pageSelect" class="form-select form-select-lg shadow-sm fw-semibold">
                    <option value="" disabled selected>Página...</option>
                    <option value="1">Página 1</option>
                    <option value="2">Página 2</option>
                    <option value="3">Página 3</option>
                    <option value="4">Página 4</option>
                    <option value="5">Página 5</option>
                    <option value="6">Página 6</option>
                    <option value="7">Página 7</option>
                    <option value="8">Página 8</option>
                    <option value="9">Página 9</option>
                    <option value="10">Página 10</option>
                </select>
            </div>
        </form>
    </header>

    <main class="container">
        <!-- BÚSQUEDA INDIVIDUAL -->
        <div id="pokemon-info" class="mb-4"></div>

        <!-- GRILLA PRINCIPAL -->
        <section id="cards-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 justify-content-center">
        </section>
    </main>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

    <!-- LÓGICA JAVASCRIPT -->
    <script src="./main.js"></script>
</body>

</html>
